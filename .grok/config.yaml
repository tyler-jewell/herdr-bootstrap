# herdr-bootstrap Grok config — version-controlled source of truth
#
# v1 snapshot: mirrored from this machine's ~/.grok/config.toml immediately
# before first sync (saved as ~/.grok/config.toml.pre-herdr-bootstrap).
# Intentional deltas vs that snapshot:
#   - features.lsp_tools = true  (model-visible lsp tool for Rust + Go)
# LSP server binaries/config: .grok/lsp.json (rust-analyzer + gopls)
#
# Process (override entire local Grok config from this file):
#   1. Edit THIS file in the repo and commit.
#   2. Run:  sh install.sh   OR   bin/sync-grok-config
#   3. That overwrites ~/.grok/config.yaml (copy of this file) and regenerates
#      ~/.grok/config.toml (what Grok actually reads for global settings).
#   4. Project LSP servers stay in .grok/lsp.json (committed; Grok reads project file).
#
# Grok does not load project [features] from .grok/config.toml — only ~/.grok/config.toml.
# Hence the sync step is required for lsp_tools and other global keys.
#
# Agent rule: for Rust/Go source questions, use the lsp tool (and live tree) —
# code on this machine is authoritative; docs can lag.

cli:
  installer: internal

marketplace:
  default_skills_installs_purged: true
  official_marketplace_auto_installed: true
  sources:
    - name: xAI Official
      git: https://github.com/xai-org/plugin-marketplace.git

ui:
  max_thoughts_width: 120
  fork_secondary_model: grok-4.5
  yolo: false
  compact_mode: false
  permission_mode: always-approve

# Model-visible lsp tool (goToDefinition, findReferences, hover, symbols, …).
# Passive diagnostics need only .grok/lsp.json + rust-analyzer/gopls on PATH.
# Servers: rust (rust-analyzer), go (gopls) — see lsp.json.
features:
  lsp_tools: true
