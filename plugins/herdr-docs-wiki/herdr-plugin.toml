id = "herdr.docs-wiki"
name = "Docs Wiki"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Doctor and freshness hooks for per-repo docs/* LLM wikis"
platforms = ["macos", "linux"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-docs-wiki", "./cmd/herdr-docs-wiki"]

[[startup]]
command = ["./bin/herdr-docs-wiki", "startup"]

[[actions]]
id = "doctor"
title = "Docs wiki doctor (all projects)"
contexts = ["workspace"]
command = ["./bin/herdr-docs-wiki", "doctor"]

[[actions]]
id = "doctor-current"
title = "Docs wiki doctor (this space)"
contexts = ["workspace"]
command = ["./bin/herdr-docs-wiki", "doctor", "--current"]

[[actions]]
id = "nudge-wiki"
title = "Nudge: update docs wiki for this space"
contexts = ["workspace"]
command = ["./bin/herdr-docs-wiki", "nudge", "--current"]

[[actions]]
id = "fix-policy"
title = "Apply wiki policy pin + AGENTS block"
contexts = ["workspace"]
command = ["./bin/herdr-docs-wiki", "fix", "--current", "--apply-policy"]

[[events]]
on = "pane.agent_status_changed"
command = ["./bin/herdr-docs-wiki", "hook", "agent-status"]

[[events]]
on = "workspace.focused"
command = ["./bin/herdr-docs-wiki", "hook", "workspace-focused"]
