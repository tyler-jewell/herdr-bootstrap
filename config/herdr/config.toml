# Herdr GLOBAL config — source of truth in herdr-bootstrap.
# Synced to ~/.config/herdr/config.toml by: bin/sync-herdr-config (install.sh).
# Do not hand-edit the live home copy for team settings; edit this file and re-sync.
#
# Docs: https://herdr.dev/docs/configuration/
# Reference: https://herdr.dev/docs/config-reference/

onboarding = false

[theme]
name = "catppuccin"

[ui]
# Agents visible on pane borders for multi-agent tabs.
show_agent_labels_on_pane_borders = true
pane_borders = true
confirm_close = true
# Attention queue: blocked/done float up so multi-agent tabs are scannable.
# (Does not change prompt delivery — see .grok/rules/herdr-multi-agent.md.)
agent_panel_sort = "priority"

[ui.toast]
# In-app toasts when background agents finish or need input.
# Was "off" — multi-agent crews looked "dead" while Grok queues/#N prompts
# stacked and API retries ran; humans could not see idle/done without focusing panes.
# Suppresses for the active tab. Does not inject messages into agents.
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true

[session]
# Resume supported agent panes after Herdr server restart (needs integrations).
resume_agents_on_restore = true

[update]
channel = "stable"
version_check = true
manifest_check = true

# --- Experimental (shared intentionally) ---
# Kitty graphics: terminal image protocol for agent-browser snapshots / panes.
# Requires a Kitty-graphics-capable outer terminal (Kitty, Ghostty, WezTerm, …).
# Harmless when unsupported; jewell.agent-browser falls back to Preview/system open.
[experimental]
kitty_graphics = true
allow_nested = false
pane_history = false

# --- Managed keybindings (plugin actions) ---
# agent-browser (vercel-labs/agent-browser wrapper) — monorepo jewell.agent-browser
[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "jewell.agent-browser.open"
description = "agent-browser open example.com"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "jewell.agent-browser.snapshot"
description = "agent-browser snapshot + show"

[[keys.command]]
key = "prefix+shift+w"
type = "plugin_action"
command = "jewell.agent-browser.ui"
description = "agent-browser live stream widget"

# Docs wiki doctor for current Herdr space — monorepo jewell.docs-wiki
[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "jewell.docs-wiki.doctor-current"
description = "docs wiki doctor (current space)"
